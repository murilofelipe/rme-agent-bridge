version: 2

# Só minor/patch das dev-deps, num PR agrupado por semana. Majors do toolchain
# (typescript, eslint, @typescript-eslint/*, jest) exigem migração manual —
# faça à mão quando quiser, o Dependabot não abre PR pra eles.
updates:
  - package-ecosystem: npm
    directory: /sdk-node
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mcp-node
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
