name: Release

# Publica @rme-agent-bridge/sdk e @rme-agent-bridge/mcp no npm quando você
# empurra uma tag vX.Y.Z (as duas versões andam em lockstep).
# Requer o secret NPM_TOKEN no repo (Settings → Secrets and variables → Actions):
# um Granular Access Token do npm com write em @rme-agent-bridge e bypass 2FA.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance (npm --provenance); precisa de repo público
    strategy:
      fail-fast: false
      matrix:
        pkg: [sdk-node, mcp-node]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Confere tag == package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG — bump o package.json"; exit 1; }

      - name: Já publicado?
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER já está no npm — nada a fazer"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
